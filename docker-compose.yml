# Local stack.
#   docker compose up -d                      -> PostgreSQL only (run the API and dashboard from your IDE / npm)
#   docker compose --profile kafka up -d      -> + Kafka (then start the API with INGEST_MODE=kafka)
#   docker compose --profile full up -d --build -> everything in containers: Postgres, Kafka, API, dashboard
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    # Host port 5434, so it does not clash with a PostgreSQL already installed on 5432.
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    profiles: ["kafka", "full"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"

  api:
    build: ./backend
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinel
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INGEST_MODE: kafka
      CORS_ORIGINS: http://localhost:5174,http://localhost:8081
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    profiles: ["full"]
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  pgdata:
